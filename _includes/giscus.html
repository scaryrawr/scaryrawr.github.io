<div class="wrapper" data-giscus>
  <script
    src="https://giscus.app/client.js"
    data-repo="scaryrawr/scaryrawr.comments"
    data-repo-id="R_kgDON_6iqA"
    data-category="Announcements"
    data-category-id="DIC_kwDON_6iqM4CnW9i"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async
  ></script>
</div>
<script>
  // Keep giscus in sync with the current light/dark theme.
  (function () {
    var holder = document.querySelector("[data-giscus]");
    if (!holder) return;
    function setGiscusTheme(theme) {
      var iframe = holder.querySelector("iframe.giscus-frame");
      if (iframe) {
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          "https://giscus.app"
        );
      }
    }
    // Correct the initial theme before the giscus iframe is created.
    var clientScript = holder.querySelector("script[src*='giscus.app']");
    if (clientScript && document.documentElement.getAttribute("data-theme") === "dark") {
      clientScript.setAttribute("data-theme", "transparent");
    }
    document.addEventListener("themechange", function (e) {
      setGiscusTheme(e.detail.theme === "dark" ? "transparent" : "light");
    });
  })();
</script>
